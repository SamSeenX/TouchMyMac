<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sandBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f0e8dc"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#182221" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Base (Warm Oat Beige) -->
  <rect x="14" y="14" width="228" height="228" rx="54" fill="url(#sandBase)" stroke="#ded4c5" stroke-width="2.5" filter="url(#softShadow)"/>

  <!-- Inner Porcelain White Trackpad Surface -->
  <rect x="36" y="36" width="184" height="184" rx="40" fill="#ffffff" stroke="#e8dfd3" stroke-width="2"/>

  <!-- Subtle Dashed Wave Pulse -->
  <circle cx="128" cy="128" r="54" fill="none" stroke="#0f766e" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="5 5"/>

  <!-- Touch Ripple Glow -->
  <circle cx="128" cy="128" r="32" fill="url(#tealGlow)"/>

  <!-- Core Touch Point (Studio Teal) -->
  <circle cx="128" cy="128" r="14" fill="url(#tealGrad)"/>
  <circle cx="128" cy="128" r="6" fill="#ffffff"/>

  <!-- Minimal Japanese Corner Accents -->
  <circle cx="196" cy="60" r="3.5" fill="#0f766e" fill-opacity="0.5"/>
  <circle cx="60" cy="196" r="3.5" fill="#c2883c" fill-opacity="0.6"/>
</svg>
