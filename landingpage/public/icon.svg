<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="mochiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff0f5"/>
    </linearGradient>
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="touchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="pastelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#ff7597" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Base (Light Theme Mochi) -->
  <rect x="14" y="14" width="228" height="228" rx="56" fill="url(#mochiBg)" stroke="#ffb6c7" stroke-width="3" filter="url(#pastelShadow)"/>

  <!-- Inner Soft Trackpad Surface -->
  <rect x="36" y="36" width="184" height="184" rx="42" fill="#ffffff" stroke="#fce7f3" stroke-width="2.5"/>

  <!-- Subtle Dashed Wave Pulse -->
  <circle cx="128" cy="128" r="56" fill="none" stroke="#ff7597" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="6 6"/>

  <!-- Touch Ripple Glow -->
  <circle cx="128" cy="128" r="34" fill="url(#touchGlow)"/>

  <!-- Core Touch Point (Sakura Pink with White Mochi Center) -->
  <circle cx="128" cy="128" r="15" fill="url(#sakuraGrad)"/>
  <circle cx="128" cy="128" r="7" fill="#ffffff"/>

  <!-- Cute Sparkles -->
  <path d="M188 64 Q188 76 200 76 Q188 76 188 88 Q188 76 176 76 Q188 76 188 64 Z" fill="#ff7597"/>
  <path d="M68 180 Q68 188 76 188 Q68 188 68 196 Q68 188 60 188 Q68 188 68 180 Z" fill="#a78bfa"/>
  <circle cx="198" cy="176" r="4" fill="#fed7aa"/>
  <circle cx="62" cy="76" r="3.5" fill="#6ee7b7"/>
</svg>
