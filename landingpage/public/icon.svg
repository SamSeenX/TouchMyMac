<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8da9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="mochiSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff0f5"/>
    </linearGradient>
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7597" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff7597" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Base -->
  <rect x="14" y="14" width="228" height="228" rx="56" fill="url(#sakuraGrad)" filter="url(#softShadow)"/>

  <!-- Inner Soft Mochi Trackpad Surface -->
  <rect x="36" y="36" width="184" height="184" rx="42" fill="url(#mochiSurface)" stroke="#ffffff" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Subtle Dashed Wave Pulse -->
  <circle cx="128" cy="128" r="54" fill="none" stroke="#ff7597" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="6 6"/>

  <!-- Touch Ripple Glow -->
  <circle cx="128" cy="128" r="32" fill="url(#sparkleGlow)"/>

  <!-- Core Touch Point -->
  <circle cx="128" cy="128" r="14" fill="#ff6e91"/>
  <circle cx="128" cy="128" r="8" fill="#ffffff"/>

  <!-- Cute Sparkle Accents -->
  <path d="M186 64 Q186 76 198 76 Q186 76 186 88 Q186 76 174 76 Q186 76 186 64 Z" fill="#ff7597"/>
  <path d="M68 180 Q68 188 76 188 Q68 188 68 196 Q68 188 60 188 Q68 188 68 180 Z" fill="#a78bfa"/>
</svg>
