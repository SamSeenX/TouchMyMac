<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f6ef7"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <radialGradient id="touchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#4f6ef7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4f6ef7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bgGrad)" stroke="#262c3e" stroke-width="2"/>

  <!-- Trackpad Surface Contour -->
  <rect x="36" y="36" width="184" height="184" rx="36" fill="#10131d" stroke="url(#trackGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Outer Pulse Ring -->
  <circle cx="128" cy="128" r="56" fill="none" stroke="#4f6ef7" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Inner Pulse Ring -->
  <circle cx="128" cy="128" r="42" fill="none" stroke="url(#trackGrad)" stroke-width="2.5" stroke-opacity="0.75" filter="url(#glow)"/>

  <!-- Touch Point Glow -->
  <circle cx="128" cy="128" r="28" fill="url(#touchGlow)"/>

  <!-- Core Touch Indicator -->
  <circle cx="128" cy="128" r="12" fill="#ffffff" filter="url(#glow)"/>

  <!-- Apple Command Glyph (Top Right Accent) -->
  <path d="M194 62 C190 62 187 65 187 69 C187 73 190 76 194 76 C198 76 201 73 201 69 C201 65 198 62 194 62 Z M181 76 L181 69 C181 61.8 186.8 56 194 56 C201.2 56 207 61.8 207 69 C207 76.2 201.2 82 194 82 L181 82 Z" fill="#4f6ef7" fill-opacity="0.8"/>
</svg>
