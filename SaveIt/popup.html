<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaveIt</title>
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/dropdown.css">
  <link rel="stylesheet" href="src/popup/popup.css">
</head>
<body>
  <div class="popup-header">
    <div class="logo-area">
      <img src="icons/icon-48.png" alt="SaveIt" class="logo-icon">
      <span class="app-name">SaveIt</span>
    </div>
    <span id="saveStatus" class="status-badge">New Bookmark</span>
  </div>

  <div class="preview-box">
    <img id="previewImg" class="preview-img" alt="Thumbnail Preview">
    <div id="previewPlaceholder" class="preview-placeholder">Capturing page snapshot...</div>
  </div>

  <div class="form-group">
    <label class="form-label" for="bookmarkTitle">Title</label>
    <input type="text" id="bookmarkTitle" class="input-text" placeholder="Page title...">
  </div>

  <div class="form-group">
    <label class="form-label">Folder</label>
    <div id="folderDropdownContainer"></div>
  </div>

  <div class="actions-row">
    <button id="saveBtn" class="btn btn-primary">Save Bookmark</button>
    <button id="viewAllBtn" class="btn btn-secondary">View All</button>
  </div>

  <script type="module" src="src/popup/popup.js"></script>
</body>
</html>
